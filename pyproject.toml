[project]
name = "molecular-prediction"
version = "0.2.0"
description = "How much 3D geometry does a GNN need? GIN vs E(3)-invariant vs E(3)-equivariant models on QM9"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "torch-geometric>=2.7",
    "tensorboard",
    "matplotlib",
    "networkx",
    "numpy",
    "pot",
]

[project.scripts]
molpred = "molecular_prediction.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molecular_prediction"]
